apiVersion: apps/v1
kind: Deployment
metadata:
  name: tatuscan-api
  namespace: tatuscan
  labels:
    app: tatuscan
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tatuscan
      component: api
  template:
    metadata:
      labels:
        app: tatuscan
        component: api
    spec:
      containers:
      - name: api
        image: carlosrabelo/tatuscan-api:latest
        ports:
        - name: http
          containerPort: 8040
        envFrom:
        - configMapRef:
            name: tatuscan-config
        - secretRef:
            name: tatuscan-secrets
        env:
        - name: TATUSCAN_PORT
          value: "8040"
        volumeMounts:
        - name: data-volume
          mountPath: /data
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
      volumes:
      - name: data-volume
        persistentVolumeClaim:
          claimName: tatuscan-data-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tatuscan-web
  namespace: tatuscan
  labels:
    app: tatuscan
    component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tatuscan
      component: web
  template:
    metadata:
      labels:
        app: tatuscan
        component: web
    spec:
      containers:
      - name: web
        image: carlosrabelo/tatuscan-web:latest
        ports:
        - name: http
          containerPort: 8050
        env:
        - name: TATUSCAN_PORT
          value: "8050"
        - name: TATUSCAN_API_URL
          valueFrom:
            configMapKeyRef:
              name: tatuscan-config
              key: TATUSCAN_API_URL
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: tatuscan-config
              key: LOG_LEVEL
        - name: TATUSCAN_OFFLINE_AFTER
          valueFrom:
            configMapKeyRef:
              name: tatuscan-config
              key: TATUSCAN_OFFLINE_AFTER
        - name: TATUSCAN_LANG
          valueFrom:
            configMapKeyRef:
              name: tatuscan-config
              key: TATUSCAN_LANG
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "128Mi"
            cpu: "100m"
